<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Density · compact / cozy / roomy</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Inter:wght@400;500;600&display=swap");
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#f5f1ec;color:#1a1814;font-family:"Inter",system-ui,sans-serif;height:100%;overflow:hidden}
.card{width:700px;padding:22px 26px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.kicker{font-family:"Inter",sans-serif;font-weight:500;font-size:10px;line-height:1;letter-spacing:1.8px;text-transform:uppercase;color:#7a766e}
.kicker--accent{color:#c96442}
.swatch{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.chip{width:100%;height:64px;border-radius:14px}
.chip--ring{box-shadow:inset 0 0 0 1px rgba(26,24,20,0.08)}
.chip-meta{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:11px;line-height:1.3}
.chip-name{font-weight:500;color:#1a1814}
.chip-hex{color:#7a766e;font-variant-numeric:tabular-nums}
.divider{height:1px;background:rgba(26,24,20,0.10);margin:4px 0}
.note{font-family:"Fraunces",serif;font-size:12px;line-height:1.4;color:#7a766e;font-style:italic}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:#7a766e}
</style>
</head>
<body>
<div class="card">

<div class="kicker">Density</div>
<div class="row" style="gap:16px">
  
    <div style="flex:1;background:#fff;border-radius:18px;padding:12px;box-shadow:0 1px 2px rgba(26,24,20,0.04),0 8px 24px rgba(26,24,20,0.06)">
      <div class="kicker" style="margin-bottom:8px">Compact</div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <div style="height:18px;background:#e7dccf;border-radius:6px"></div>
        <div style="height:14px;background:#f4dccf;border-radius:6px;width:70%"></div>
        <div style="height:14px;background:#f4dccf;border-radius:6px;width:55%"></div>
      </div>
      <div class="code" style="margin-top:8px">card 12 · screen 18 · gap 8</div>
    </div>
    <div style="flex:1;background:#fff;border-radius:18px;padding:16px;box-shadow:0 1px 2px rgba(26,24,20,0.04),0 8px 24px rgba(26,24,20,0.06)">
      <div class="kicker" style="margin-bottom:12px">Cozy · default</div>
      <div style="display:flex;flex-direction:column;gap:12px">
        <div style="height:18px;background:#e7dccf;border-radius:6px"></div>
        <div style="height:14px;background:#f4dccf;border-radius:6px;width:70%"></div>
        <div style="height:14px;background:#f4dccf;border-radius:6px;width:55%"></div>
      </div>
      <div class="code" style="margin-top:12px">card 16 · screen 22 · gap 12</div>
    </div>
    <div style="flex:1;background:#fff;border-radius:18px;padding:20px;box-shadow:0 1px 2px rgba(26,24,20,0.04),0 8px 24px rgba(26,24,20,0.06)">
      <div class="kicker" style="margin-bottom:16px">Roomy</div>
      <div style="display:flex;flex-direction:column;gap:16px">
        <div style="height:18px;background:#e7dccf;border-radius:6px"></div>
        <div style="height:14px;background:#f4dccf;border-radius:6px;width:70%"></div>
        <div style="height:14px;background:#f4dccf;border-radius:6px;width:55%"></div>
      </div>
      <div class="code" style="margin-top:16px">card 20 · screen 26 · gap 16</div>
    </div>
</div>
</div>
</body>
</html>
