<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Pills · all variants</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Inter:wght@400;500;600&display=swap");
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#f5f1ec;color:#1a1814;font-family:"Inter",system-ui,sans-serif;height:100%;overflow:hidden}
.card{width:700px;padding:22px 26px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.kicker{font-family:"Inter",sans-serif;font-weight:500;font-size:10px;line-height:1;letter-spacing:1.8px;text-transform:uppercase;color:#7a766e}
.kicker--accent{color:#c96442}
.swatch{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.chip{width:100%;height:64px;border-radius:14px}
.chip--ring{box-shadow:inset 0 0 0 1px rgba(26,24,20,0.08)}
.chip-meta{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:11px;line-height:1.3}
.chip-name{font-weight:500;color:#1a1814}
.chip-hex{color:#7a766e;font-variant-numeric:tabular-nums}
.divider{height:1px;background:rgba(26,24,20,0.10);margin:4px 0}
.note{font-family:"Fraunces",serif;font-size:12px;line-height:1.4;color:#7a766e;font-style:italic}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:#7a766e}
</style>
</head>
<body>
<div class="card">

<div class="kicker">Pills</div>
<div class="row" style="gap:12px">
  <button style="border:none;background:#1a1814;color:#fff;padding:13px 32px;border-radius:100px;cursor:pointer;font:500 12px/1 'Inter';letter-spacing:1.5px;text-transform:uppercase">Mark done</button>
  <button style="border:1px solid #e7dccf;background:#fff;color:#7a766e;padding:9px 14px;border-radius:100px;cursor:pointer;font:500 12px/1 'Inter'">Pause</button>
  <button style="border:1px solid #e7dccf;background:transparent;color:#7a766e;padding:12px 16px;border-radius:100px;cursor:pointer;font:500 13px/1 'Inter'">Skip this turn</button>
  <button style="border:none;background:#c96442;color:#fff;padding:9px 16px;border-radius:100px;cursor:pointer;font:600 11px/1 'Inter';letter-spacing:1.2px;text-transform:uppercase">Resume</button>
</div>
<div class="row" style="gap:18px;margin-top:6px">
  <div class="code">primary · ink</div>
  <div class="code">secondary · card</div>
  <div class="code">ghost · transparent</div>
  <div class="code">accent · coral (rare)</div>
</div>
<div class="note">Primary CTAs are always ink-on-bone. The coral pill exists only inside the paused banner's Resume action.</div>
</div>
</body>
</html>
