<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Radii system</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Inter:wght@400;500;600&display=swap");
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#f5f1ec;color:#1a1814;font-family:"Inter",system-ui,sans-serif;height:100%;overflow:hidden}
.card{width:700px;padding:22px 26px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.kicker{font-family:"Inter",sans-serif;font-weight:500;font-size:10px;line-height:1;letter-spacing:1.8px;text-transform:uppercase;color:#7a766e}
.kicker--accent{color:#c96442}
.swatch{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.chip{width:100%;height:64px;border-radius:14px}
.chip--ring{box-shadow:inset 0 0 0 1px rgba(26,24,20,0.08)}
.chip-meta{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:11px;line-height:1.3}
.chip-name{font-weight:500;color:#1a1814}
.chip-hex{color:#7a766e;font-variant-numeric:tabular-nums}
.divider{height:1px;background:rgba(26,24,20,0.10);margin:4px 0}
.note{font-family:"Fraunces",serif;font-size:12px;line-height:1.4;color:#7a766e;font-style:italic}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:#7a766e}
</style>
</head>
<body>
<div class="card">

<div class="kicker">Radii</div>
<div class="row">
  
    <div class="swatch" style="align-items:center">
      <div style="width:80px;height:80px;background:#fff;box-shadow:0 1px 2px rgba(26,24,20,0.04),0 8px 24px rgba(26,24,20,0.06);border-radius:28px"></div>
      <div style="font-family:'Inter';font-weight:500;font-size:11px;color:#1a1814">28px</div>
      <div class="note" style="font-size:10px;text-align:center;font-style:normal;color:#b5b0a6">Hero card</div>
    </div>
    <div class="swatch" style="align-items:center">
      <div style="width:80px;height:80px;background:#fff;box-shadow:0 1px 2px rgba(26,24,20,0.04),0 8px 24px rgba(26,24,20,0.06);border-radius:22px"></div>
      <div style="font-family:'Inter';font-weight:500;font-size:11px;color:#1a1814">22px</div>
      <div class="note" style="font-size:10px;text-align:center;font-style:normal;color:#b5b0a6">List card</div>
    </div>
    <div class="swatch" style="align-items:center">
      <div style="width:80px;height:80px;background:#fff;box-shadow:0 1px 2px rgba(26,24,20,0.04),0 8px 24px rgba(26,24,20,0.06);border-radius:18px"></div>
      <div style="font-family:'Inter';font-weight:500;font-size:11px;color:#1a1814">18px</div>
      <div class="note" style="font-size:10px;text-align:center;font-style:normal;color:#b5b0a6">Queue list, inputs block</div>
    </div>
    <div class="swatch" style="align-items:center">
      <div style="width:80px;height:80px;background:#fff;box-shadow:0 1px 2px rgba(26,24,20,0.04),0 8px 24px rgba(26,24,20,0.06);border-radius:16px"></div>
      <div style="font-family:'Inter';font-weight:500;font-size:11px;color:#1a1814">16px</div>
      <div class="note" style="font-size:10px;text-align:center;font-style:normal;color:#b5b0a6">Inner clusters</div>
    </div>
    <div class="swatch" style="align-items:center">
      <div style="width:80px;height:80px;background:#fff;box-shadow:0 1px 2px rgba(26,24,20,0.04),0 8px 24px rgba(26,24,20,0.06);border-radius:14px"></div>
      <div style="font-family:'Inter';font-weight:500;font-size:11px;color:#1a1814">14px</div>
      <div class="note" style="font-size:10px;text-align:center;font-style:normal;color:#b5b0a6">Single input</div>
    </div>
    <div class="swatch" style="align-items:center">
      <div style="width:80px;height:80px;background:#fff;box-shadow:0 1px 2px rgba(26,24,20,0.04),0 8px 24px rgba(26,24,20,0.06);border-radius:100px"></div>
      <div style="font-family:'Inter';font-weight:500;font-size:11px;color:#1a1814">100px</div>
      <div class="note" style="font-size:10px;text-align:center;font-style:normal;color:#b5b0a6">Pill</div>
    </div>
</div>
</div>
</body>
</html>
