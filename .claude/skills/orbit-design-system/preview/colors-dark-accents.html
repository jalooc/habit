<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<title>Dark · Accents</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Inter:wght@400;500;600&display=swap");
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#f5f1ec;color:#1a1814;font-family:"Inter",system-ui,sans-serif;height:100%;overflow:hidden}
.card{width:700px;padding:22px 26px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.kicker{font-family:"Inter",sans-serif;font-weight:500;font-size:10px;line-height:1;letter-spacing:1.8px;text-transform:uppercase;color:#7a766e}
.kicker--accent{color:#c96442}
.swatch{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.chip{width:100%;height:64px;border-radius:14px}
.chip--ring{box-shadow:inset 0 0 0 1px rgba(26,24,20,0.08)}
.chip-meta{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:11px;line-height:1.3}
.chip-name{font-weight:500;color:#1a1814}
.chip-hex{color:#7a766e;font-variant-numeric:tabular-nums}
.divider{height:1px;background:rgba(26,24,20,0.10);margin:4px 0}
.note{font-family:"Fraunces",serif;font-size:12px;line-height:1.4;color:#7a766e;font-style:italic}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:#7a766e}

html,body{background:#1c1d20;color:#ece8e2}
.kicker{color:#9a958c}
.chip-name{color:#ece8e2}.chip-hex{color:#9a958c}
.note{color:#9a958c}.code{color:#9a958c}
.divider{background:rgba(236,232,226,0.10)}
.chip--ring{box-shadow:inset 0 0 0 1px rgba(236,232,226,0.10)}
</style>
</head>
<body>
<div class="card">

<div class="kicker kicker--accent" style="color:#e3a37a">Dark · Accents</div>
<div class="row">
  
    <div class="swatch">
      <div class="chip chip--ring" style="background:#e3a37a"></div>
      <div class="chip-meta"><span class="chip-name">--accent</span><span class="chip-hex">#e3a37a</span></div>
      <div class="note" style="font-size:11px">Sand-coral · softened for dark</div>
    </div>
    <div class="swatch">
      <div class="chip chip--ring" style="background:#3a342d"></div>
      <div class="chip-meta"><span class="chip-name">--accent-dim</span><span class="chip-hex">#3a342d</span></div>
      <div class="note" style="font-size:11px">Dim brown</div>
    </div>
    <div class="swatch">
      <div class="chip chip--ring" style="background:#2b2723"></div>
      <div class="chip-meta"><span class="chip-name">--accent-soft</span><span class="chip-hex">#2b2723</span></div>
      <div class="note" style="font-size:11px">Chip wash</div>
    </div>
    <div class="swatch">
      <div class="chip chip--ring" style="background:rgba(236,232,226,0.10)"></div>
      <div class="chip-meta"><span class="chip-name">--rule</span><span class="chip-hex">rgba(236,232,226,0.10)</span></div>
      <div class="note" style="font-size:11px">Subtle divider</div>
    </div>
</div>
</div>
</body>
</html>
