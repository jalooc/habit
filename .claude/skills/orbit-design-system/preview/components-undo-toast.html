<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Undo toast</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Inter:wght@400;500;600&display=swap");
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#f5f1ec;color:#1a1814;font-family:"Inter",system-ui,sans-serif;height:100%;overflow:hidden}
.card{width:700px;padding:22px 26px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.kicker{font-family:"Inter",sans-serif;font-weight:500;font-size:10px;line-height:1;letter-spacing:1.8px;text-transform:uppercase;color:#7a766e}
.kicker--accent{color:#c96442}
.swatch{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.chip{width:100%;height:64px;border-radius:14px}
.chip--ring{box-shadow:inset 0 0 0 1px rgba(26,24,20,0.08)}
.chip-meta{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:11px;line-height:1.3}
.chip-name{font-weight:500;color:#1a1814}
.chip-hex{color:#7a766e;font-variant-numeric:tabular-nums}
.divider{height:1px;background:rgba(26,24,20,0.10);margin:4px 0}
.note{font-family:"Fraunces",serif;font-size:12px;line-height:1.4;color:#7a766e;font-style:italic}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:#7a766e}
</style>
</head>
<body>
<div class="card">

<div class="kicker">Undo toast</div>
<div style="display:flex;justify-content:center;padding:14px 0">
  <div style="background:#1a1814;color:#fff;border-radius:100px;padding:10px 14px 10px 18px;display:inline-flex;align-items:center;gap:14px;box-shadow:0 1px 2px rgba(26,24,20,0.04),0 8px 32px rgba(26,24,20,0.08)">
    <span style="font:400 13px 'Fraunces',serif">Logged · Hollow hold</span>
    <span style="font:500 12px/1 'Inter';color:#c96442;letter-spacing:1.2px;text-transform:uppercase">Undo</span>
  </div>
</div>
<div class="note">Black pill, 5.5 s timeout. Coral "Undo" is the only chromatic affordance.</div>
</div>
</body>
</html>
