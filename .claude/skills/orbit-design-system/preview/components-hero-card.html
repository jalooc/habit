<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Hero card · rotation + CTA</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Inter:wght@400;500;600&display=swap");
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#f5f1ec;color:#1a1814;font-family:"Inter",system-ui,sans-serif;height:100%;overflow:hidden}
.card{width:700px;padding:22px 26px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.kicker{font-family:"Inter",sans-serif;font-weight:500;font-size:10px;line-height:1;letter-spacing:1.8px;text-transform:uppercase;color:#7a766e}
.kicker--accent{color:#c96442}
.swatch{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.chip{width:100%;height:64px;border-radius:14px}
.chip--ring{box-shadow:inset 0 0 0 1px rgba(26,24,20,0.08)}
.chip-meta{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:11px;line-height:1.3}
.chip-name{font-weight:500;color:#1a1814}
.chip-hex{color:#7a766e;font-variant-numeric:tabular-nums}
.divider{height:1px;background:rgba(26,24,20,0.10);margin:4px 0}
.note{font-family:"Fraunces",serif;font-size:12px;line-height:1.4;color:#7a766e;font-style:italic}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:#7a766e}
</style>
</head>
<body>
<div class="card">

<div class="kicker">Hero card</div>
<div style="background:#fff;border-radius:28px;padding:24px 14px 20px;box-shadow:0 1px 2px rgba(26,24,20,0.04),0 8px 32px rgba(26,24,20,0.08);display:flex;flex-direction:column;align-items:center">
  <div style="font:500 11px/1 'Inter';letter-spacing:1.8px;color:#c96442;text-transform:uppercase;margin-bottom:16px">CORE</div>
  <svg width="170" height="170" viewBox="0 0 244 244">
    <circle cx="122" cy="122" r="104" fill="none" stroke="#e7dccf" stroke-width="1" />
    <circle cx="122.0" cy="18.0" r="12" fill="#c96442" stroke="#c96442" stroke-width="0"/><circle cx="122.0" cy="18.0" r="4" fill="#fff"/><circle cx="220.9" cy="89.9" r="5" fill="#fff" stroke="#e7dccf" stroke-width="1.5"/><circle cx="183.1" cy="206.1" r="5" fill="#fff" stroke="#e7dccf" stroke-width="1.5"/><circle cx="60.9" cy="206.1" r="5" fill="#fff" stroke="#e7dccf" stroke-width="1.5"/><circle cx="23.1" cy="89.9" r="5" fill="#fff" stroke="#e7dccf" stroke-width="1.5"/>
    <text x="122" y="118" text-anchor="middle" style="font:500 10px 'Inter';fill:#b5b0a6;letter-spacing:2px;text-transform:uppercase">UP NEXT · 3/5</text>
    <text x="122" y="142" text-anchor="middle" style="font:400 16px 'Fraunces',serif;fill:#1a1814">Hollow hold, 45s</text>
  </svg>
  <button style="margin-top:14px;border:none;background:#1a1814;color:#fff;padding:11px 28px;border-radius:100px;font:500 11px/1 'Inter';letter-spacing:1.5px;text-transform:uppercase">Mark done</button>
</div>
</div>
</body>
</html>
