<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>The orbit ring</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Inter:wght@400;500;600&display=swap");
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#f5f1ec;color:#1a1814;font-family:"Inter",system-ui,sans-serif;height:100%;overflow:hidden}
.card{width:700px;padding:22px 26px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.kicker{font-family:"Inter",sans-serif;font-weight:500;font-size:10px;line-height:1;letter-spacing:1.8px;text-transform:uppercase;color:#7a766e}
.kicker--accent{color:#c96442}
.swatch{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.chip{width:100%;height:64px;border-radius:14px}
.chip--ring{box-shadow:inset 0 0 0 1px rgba(26,24,20,0.08)}
.chip-meta{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:11px;line-height:1.3}
.chip-name{font-weight:500;color:#1a1814}
.chip-hex{color:#7a766e;font-variant-numeric:tabular-nums}
.divider{height:1px;background:rgba(26,24,20,0.10);margin:4px 0}
.note{font-family:"Fraunces",serif;font-size:12px;line-height:1.4;color:#7a766e;font-style:italic}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:#7a766e}
</style>
</head>
<body>
<div class="card">

<div class="kicker kicker--accent">Signature visual</div>
<div style="display:flex;align-items:center;gap:24px;padding:8px 0">
  <svg width="180" height="180" viewBox="0 0 244 244">
    <circle cx="122" cy="122" r="104" fill="none" stroke="#e7dccf" stroke-width="1" />
    <circle cx="122.0" cy="18.0" r="18" fill="#c96442" opacity="0.12"/>
              <circle cx="122.0" cy="18.0" r="12" fill="#c96442" stroke="#c96442" stroke-width="0"/>
              <circle cx="122.0" cy="18.0" r="4" fill="#fff"/>
              <circle cx="220.9" cy="89.9" r="5" fill="#fff" stroke="#e7dccf" stroke-width="1.5"/>
              
              <circle cx="183.1" cy="206.1" r="5" fill="#fff" stroke="#e7dccf" stroke-width="1.5"/>
              
              <circle cx="60.9" cy="206.1" r="5" fill="#fff" stroke="#e7dccf" stroke-width="1.5"/>
              
              <circle cx="23.1" cy="89.9" r="5" fill="#fff" stroke="#e7dccf" stroke-width="1.5"/>
              
    <g opacity="0.4">
      <line x1="181.4" y1="40.3" x2="184.9" y2="35.4" stroke="#e7dccf" stroke-width="1"/><line x1="218.1" y1="153.2" x2="223.8" y2="155.1" stroke="#e7dccf" stroke-width="1"/><line x1="122.0" y1="223.0" x2="122.0" y2="229.0" stroke="#e7dccf" stroke-width="1"/><line x1="25.9" y1="153.2" x2="20.2" y2="155.1" stroke="#e7dccf" stroke-width="1"/><line x1="62.6" y1="40.3" x2="59.1" y2="35.4" stroke="#e7dccf" stroke-width="1"/>
    </g>
  </svg>
  <div style="flex:1">
    <div style="font:400 22px/1.2 'Fraunces',serif;color:#1a1814;letter-spacing:-0.3px">A ring of dots — up-next at 12 o'clock. Tick → the ring turns one notch.</div>
    <div class="code" style="margin-top:10px">550 ms · cubic-bezier(.55, .06, .3, 1)</div>
    <div class="code">stroke 1 · accentDim outer ring · halo pulse on active dot</div>
  </div>
</div>
</div>
</body>
</html>
